# Grimoire settings file. Copy this to configs/config.yml (one directory
# up from here, i.e. sibling to this examples/ directory) or to
# ~/.config/grimoire/config.yml, and uncomment/edit whatever you want to
# change -- any key left out keeps its built-in default (see
# lib/grimoire/theme.rb's Theme::DEFAULT). Colors are "#rrggbb" hex
# strings. --config PATH on the command line overrides both lookup
# locations.

theme:
  # The primary output (scrollback) and input (command entry) windows.
  main:
    background: '#000000'
    foreground: '#ffffff'

  # Font used for the scrollback text. `family` is passed straight through
  # as a CSS font-family value (not wrapped in quotes for you), so it can
  # be a single name ('Monospace' -- Pango's own generic alias) or a full
  # fallback list, as below: a specific font first, then a generic family
  # so the display still comes out monospaced even on a system that lacks
  # the specific one. This is the built-in default (Theme::DEFAULT) --
  # Overpass Mono ships as a bundled font under assets/fonts/ (see that
  # directory's README), loaded without needing a system-wide install.
  font:
    family: 'Overpass Mono, monospace'
    size: 11

  # Vitals-strip bar fill colors, one per tracked field, plus the shared
  # background/empty color for every bar's trough.
  vitals:
    health: '#c80000'
    mana: '#0000c8'
    stamina: '#c8a000'
    spirit: '#c8c8c8'
    mind: '#8000c8'
    encumbrance: '#969696'
    stance: '#969696'
    background: '#000000'

  # Roundtime bar fill colors -- hard roundtime (most actions) and cast
  # roundtime (spell preparation); see TASKS.md's "Basic vitals/indicator
  # area" entry for how the two combine into one displayed bar.
  roundtime:
    hard: '#c80000'
    cast: '#0000c8'
